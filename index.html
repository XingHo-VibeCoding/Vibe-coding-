<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claw · 占位首页</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #8a9099;
      --line: #e8eaed;
      --accent: #2f6bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 8px 28px rgba(31, 35, 41, 0.06);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .5px;
      color: var(--accent);
      background: rgba(47, 107, 255, .08);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 8px; line-height: 1.7; color: var(--muted); font-size: 15px; }
    .line { height: 1px; background: var(--line); margin: 26px 0; }
    dl { margin: 0; font-size: 14px; }
    dt { color: var(--muted); margin-top: 12px; }
    dd { margin: 4px 0 0; font-weight: 600; }
    .done { color: #17a673; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">DAY 2 · 占位页</span>
    <h1>Claw</h1>
    <p>这是项目的第一份文件，用来验证「本地改动 → 提交 → 推送到 GitHub」这条链路是通的。</p>
    <p>它不是最终页面，真正的功能会在 Day 7 做 MVP 时才开始写。</p>

    <div class="line"></div>

    <dl>
      <dt>今日状态</dt>
      <dd class="done">仓库已初始化 · 第一次提交已完成</dd>

      <dt>这个文件的身份</dt>
      <dd>index.html —— 默认首页</dd>

      <dt>下一步</dt>
      <dd>Day 7：MVP 功能开发</dd>
    </dl>
  </main>
</body>
</html>
